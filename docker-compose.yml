# =============================================================================
# VocazAI — Docker Compose (Traefik + Next.js app)
# =============================================================================
# Quick start on your Hostinger VPS:
#
#   1. Copy .env.example to .env.local and fill in your keys
#   2. docker compose up -d --build
#
# Traefik will automatically:
#   - Redirect HTTP → HTTPS
#   - Issue a free Let's Encrypt SSL certificate for vocazai.com
#
# Update the app (zero-downtime):
#   docker compose up -d --build app
# =============================================================================

services:

  # ---------- Traefik reverse proxy + SSL ------------------------------------
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # read container labels
      - ./deploy/traefik.yml:/traefik.yml:ro            # static config
      - traefik-certs:/letsencrypt                      # persists SSL certs
    networks:
      - vocazai_net

  # ---------- Kokoro TTS microservice (internal — no public exposure) ---------
  tts:
    build:
      context: ./services/tts
      dockerfile: Dockerfile
    container_name: vocazai-tts
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - vocazai_net
    # No Traefik labels — only the app container talks to this service

  # ---------- Next.js app ----------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: vocazai-app
    restart: unless-stopped
    env_file:
      - .env.local
    expose:
      - "3000"
    depends_on:
      - tts
    networks:
      - vocazai_net
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      - "traefik.docker.network=vocazai_net"

      # HTTPS router
      - "traefik.http.routers.vocazai.rule=Host(`vocazai.com`) || Host(`www.vocazai.com`)"
      - "traefik.http.routers.vocazai.entrypoints=websecure"
      - "traefik.http.routers.vocazai.tls=true"
      - "traefik.http.routers.vocazai.tls.certresolver=letsencrypt"
      - "traefik.http.services.vocazai.loadbalancer.server.port=3000"

      # HTTP router — redirects to HTTPS
      - "traefik.http.routers.vocazai-http.rule=Host(`vocazai.com`) || Host(`www.vocazai.com`)"
      - "traefik.http.routers.vocazai-http.entrypoints=web"
      - "traefik.http.routers.vocazai-http.middlewares=https-redirect"

      # Middleware: HTTP → HTTPS redirect
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"

      # Security headers
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=63072000"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
      - "traefik.http.routers.vocazai.middlewares=security-headers"

# ---------- Volumes & Networks -----------------------------------------------
volumes:
  traefik-certs:
    name: traefik-certs

networks:
  vocazai_net:
    name: vocazai_net
