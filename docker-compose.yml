# =============================================================================
# VocazAI — Docker Compose
#
# Multi-project VPS friendly:
#   - Traefik runs ONCE on the server, shared by all projects
#   - Each project uses its own APP_PORT (set in .env.local)
#   - All projects connect to the shared external network: traefik_net
#
# The install.sh script handles creating the network and starting Traefik
# only if it isn't already running from another project.
#
# Quick start:
#   1. Fill in .env.local (run the installer or copy .env.example)
#   2. docker compose up -d --build
#
# Update app only (zero downtime):
#   docker compose up -d --build app
# =============================================================================

services:

  # ---------- Traefik — shared reverse proxy + SSL ---------------------------
  # NOTE: The installer skips this if Traefik is already running on the server.
  # Manages HTTPS for ALL projects via domain routing — not ports.
  traefik:
    image: traefik:v2.11
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/traefik.yml:/traefik.yml:ro
      - traefik-certs:/letsencrypt
    networks:
      - traefik_net
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------- Piper TTS microservice (internal only) -------------------------
  tts:
    build:
      context: ./services/tts
      dockerfile: Dockerfile
    container_name: vocazai-tts
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - traefik_net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # ---------- Faster-Whisper STT microservice (internal only) ----------------
  stt:
    build:
      context: ./services/stt
      dockerfile: Dockerfile
    container_name: vocazai-stt
    restart: unless-stopped
    expose:
      - "9000"
    networks:
      - traefik_net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 2560M
          cpus: "1.5"

  # ---------- Next.js app ----------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: vocazai-app
    restart: unless-stopped
    env_file:
      - .env.local
    expose:
      - "${APP_PORT:-3000}"
    environment:
      - PORT=${APP_PORT:-3000}
    depends_on:
      - tts
      - stt
    networks:
      - traefik_net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_net"

      # HTTPS router
      - "traefik.http.routers.vocazai.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)"
      - "traefik.http.routers.vocazai.entrypoints=websecure"
      - "traefik.http.routers.vocazai.tls=true"
      - "traefik.http.routers.vocazai.tls.certresolver=letsencrypt"
      - "traefik.http.services.vocazai.loadbalancer.server.port=${APP_PORT:-3000}"

      # HTTP → HTTPS redirect
      - "traefik.http.routers.vocazai-http.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)"
      - "traefik.http.routers.vocazai-http.entrypoints=web"
      - "traefik.http.routers.vocazai-http.middlewares=https-redirect"
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"

      # Security headers
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=63072000"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
      - "traefik.http.routers.vocazai.middlewares=security-headers"

# ---------- Volumes & Networks -----------------------------------------------
volumes:
  traefik-certs:
    name: traefik-certs

networks:
  traefik_net:
    external: true   # shared across all projects on this server
    name: traefik_net
