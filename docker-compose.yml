# =============================================================================
# VocazAI — Docker Compose
#
# Multi-project VPS friendly:
#   - Traefik runs ONCE on the server, shared by all projects
#   - Each project uses its own APP_PORT (set in .env.local)
#   - All projects connect to the shared external network: traefik_net
#
# The install.sh script handles creating the network and starting Traefik
# only if it isn't already running from another project.
#
# Quick start:
#   1. Fill in .env.local (run the installer or copy .env.example)
#   2. docker compose up -d --build
#
# Update app only (zero downtime):
#   docker compose up -d --build app
# =============================================================================

services:

  # ---------- Traefik — shared reverse proxy + SSL ---------------------------
  # NOTE: The installer skips this if Traefik is already running on the server.
  # Manages HTTPS for ALL projects via domain routing — not ports.
  traefik:
    image: traefik:v2.11
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/traefik.yml:/traefik.yml:ro
      - traefik-certs:/letsencrypt
    networks:
      - traefik_net

  # ---------- Kokoro TTS microservice (internal only) ------------------------
  tts:
    build:
      context: ./services/tts
      dockerfile: Dockerfile
    container_name: vocazai-tts
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - traefik_net

  # ---------- Next.js app ----------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: vocazai-app
    restart: unless-stopped
    env_file:
      - .env.local
    expose:
      - "${APP_PORT:-3000}"
    environment:
      - PORT=${APP_PORT:-3000}
    depends_on:
      - tts
    networks:
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_net"

      # HTTPS router
      - "traefik.http.routers.vocazai.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)"
      - "traefik.http.routers.vocazai.entrypoints=websecure"
      - "traefik.http.routers.vocazai.tls=true"
      - "traefik.http.routers.vocazai.tls.certresolver=letsencrypt"
      - "traefik.http.services.vocazai.loadbalancer.server.port=${APP_PORT:-3000}"

      # HTTP → HTTPS redirect
      - "traefik.http.routers.vocazai-http.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)"
      - "traefik.http.routers.vocazai-http.entrypoints=web"
      - "traefik.http.routers.vocazai-http.middlewares=https-redirect"
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"

      # Security headers
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=63072000"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
      - "traefik.http.routers.vocazai.middlewares=security-headers"

# ---------- Volumes & Networks -----------------------------------------------
volumes:
  traefik-certs:
    name: traefik-certs

networks:
  traefik_net:
    external: true   # shared across all projects on this server
    name: traefik_net
