# /etc/nginx/sites-available/vocazai
# Reverse proxy for the Next.js app running under PM2 on port 3000.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/vocazai
#   sudo ln -s /etc/nginx/sites-available/vocazai /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue an SSL cert:
#   sudo certbot --nginx -d vocazai.com -d www.vocazai.com
# Certbot will rewrite this file with the SSL directives automatically.

# Rate-limit webhook endpoints (Vapi / Retell) — defined once at http{} level.
# If this block already exists in nginx.conf, remove it from here.
limit_req_zone $binary_remote_addr zone=webhooks:10m rate=20r/s;

# --- HTTP → HTTPS redirect (Certbot will add this once SSL is installed) ---
server {
    listen 80;
    listen [::]:80;
    server_name vocazai.com www.vocazai.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Everything else → HTTPS (Certbot manages this after issuing the cert)
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Main HTTPS server ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vocazai.com www.vocazai.com;

    # SSL — Certbot fills these in automatically:
    # ssl_certificate     /etc/letsencrypt/live/vocazai.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/vocazai.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Upload size (webhook payloads can be a few hundred KB)
    client_max_body_size 5M;

    # Gzip — Next.js already compresses, but enable for non-Next assets too
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # --- Static assets (long cache) ---
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --- Webhooks — rate-limited, no caching ---
    location ~ ^/api/webhooks/ {
        limit_req zone=webhooks burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # --- Health check (used by uptime monitors / PM2 healthcheck wrappers) ---
    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
        proxy_set_header Host $host;
    }

    # --- Everything else → Next.js ---
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Deny dotfiles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
