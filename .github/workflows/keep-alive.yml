# Keep the Render Free Web Service awake.
# Render Free spins the service down after 15 min of inactivity.
# A cold start adds ~30 s of latency, which is fine for the landing
# but breaks live voice agent webhooks. This workflow hits /api/health
# every 12 min to keep the service warm.
#
# When you upgrade to a paid Render plan (no spin-down), you can:
#   - delete this workflow file, OR
#   - keep it as a cheap uptime canary.
#
# To change the target URL, set a repo VARIABLE named RENDER_APP_URL
# (Settings → Secrets and variables → Actions → Variables tab).
# Defaults to https://vocazai.com if not set.

name: Keep Render Awake

on:
  schedule:
    - cron: "*/12 * * * *"   # every 12 minutes
  workflow_dispatch:          # allow manual trigger from GitHub UI
  push:
    paths:
      - ".github/workflows/keep-alive.yml"

# Lightweight job — no checkout, no node, just curl.
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Ping /api/health
        env:
          APP_URL: ${{ vars.RENDER_APP_URL || 'https://vocazai.com' }}
        run: |
          echo "Pinging $APP_URL/api/health ..."
          # --max-time 60 covers Render's cold-start (~30s) comfortably.
          # We don't fail the job if the ping fails — the goal is to keep
          # the service warm, not to crash on transient errors.
          response=$(curl -sS -o response.json -w "%{http_code}" \
            --max-time 60 \
            -H "User-Agent: github-actions-keep-alive" \
            "$APP_URL/api/health" || echo "000")
          echo "HTTP $response"
          cat response.json 2>/dev/null || echo "(no body)"
          # Exit 0 always — transient failures shouldn't spam notifications.
          exit 0
